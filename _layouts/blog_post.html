---
layout: default
---
<div class="blog-layout-wrapper">
    <div class="blog-main">
        <article class="classic-document blog-article">
            <header class="blog-article-header">
                <a class="classic-button classic-small" href="{{ '/blog' | relative_url }}">Back to blog</a>
                <h1>{{ page.title }}</h1>
                <div class="classic-small">
                    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
                    {% for tag in page.tags %}<span class="classic-tag">{{ tag }}</span>{% endfor %}
                </div>
            </header>
            <div class="blog-content">{{ content }}</div>
        </article>
    </div>
    <aside class="blog-toc-sidebar">
        <details id="blog-toc" class="blog-toc-nav" open>
            <summary class="blog-toc-title">On this page</summary>
            <nav aria-label="Table of contents"><ul class="blog-toc-list"></ul></nav>
        </details>
    </aside>
</div>
